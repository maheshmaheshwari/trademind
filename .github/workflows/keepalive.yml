# Keep the HF Space and both Timescale Cloud instances awake.
#
# Free-tier Spaces pause after ~48h without traffic, and a sleeping Space
# runs no scheduler — the 15:35 IST EOD chain would silently never start.
# This ping counts as traffic and also wakes the Space back up if it did
# go to sleep. Timescale Cloud pauses idle instances too: /api/health/db
# keeps the primary DB awake and /api/health/testdb keeps the test DB
# awake (the Space reaches it via its TEST_PG* secrets).
#
# Uses the same HF_TOKEN repo secret as deploy-backend.yml (the Space is
# private, so the health check needs auth).
#
# Note: GitHub disables cron workflows after 60 days without repo activity —
# any push resets the clock.
name: Keep Space awake

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health, /api/health/db and /api/health/testdb
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 60 \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            https://maheshmaheshwari-trademind.hf.space/api/health)
          echo "health: HTTP $code"
          # 200 = up; anything else on a wake-from-sleep first hit is fine,
          # the request itself triggers the wake. Fail only on auth errors.
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then exit 1; fi
          # DB-touching ping — Timescale Cloud's free tier pauses idle
          # services, so this SELECT 1 keeps the database awake too.
          dbcode=$(curl -s -o /dev/null -w '%{http_code}' -m 60 \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            https://maheshmaheshwari-trademind.hf.space/api/health/db)
          echo "health/db: HTTP $dbcode"
          # Test-instance ping — same idea, different database. A paused
          # instance can refuse the first attempt while it resumes.
          for i in 1 2 3; do
            testcode=$(curl -s -o /dev/null -w '%{http_code}' -m 60 \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              https://maheshmaheshwari-trademind.hf.space/api/health/testdb)
            echo "health/testdb: HTTP $testcode (attempt $i)"
            [ "$testcode" = "200" ] && break
            sleep 30
          done
