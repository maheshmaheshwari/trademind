# Regenerate trade signals from the current model set, on demand.
#
# Runs scripts/generate_trades.py against the models in the encrypted HF Hub
# store (no retraining) and writes fresh rows to the trade_signals table. Use
# after a code change to the signal logic (e.g. the expected-value BUY gate)
# to apply it without waiting for the weekly retrain or the Space's daily job.
#
# Secrets: PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD, HF_TOKEN, MODEL_KEY,
# HF_MODELS_REPO (optional).
name: Refresh trade signals

on:
  workflow_dispatch:

concurrency:
  group: refresh-signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODEL_KEY: ${{ secrets.MODEL_KEY }}
      HF_MODELS_REPO: ${{ secrets.HF_MODELS_REPO }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Sync model set from the store
        run: python scripts/model_store.py sync

      - name: Generate trade signals
        run: python scripts/generate_trades.py

      - name: Signal distribution summary
        run: |
          python - <<'PY'
          from database.db import get_connection, release_connection, _execute
          from collections import Counter
          conn = get_connection()
          d = _execute(conn, "SELECT MAX(generated_date) FROM trade_signals").fetchone()[0]
          rows = _execute(conn,
              "SELECT signal FROM trade_signals WHERE generated_date=%s AND is_active=TRUE", (d,)).fetchall()
          release_connection(conn)
          dist = Counter(r[0] for r in rows)
          print(f"signals for {d} — total {len(rows)}")
          for k in ("STRONG BUY", "BUY", "HOLD", "SELL", "STRONG SELL"):
              print(f"  {k:12s}: {dist.get(k, 0)}")
          buys = dist.get("STRONG BUY", 0) + dist.get("BUY", 0)
          print(f"actionable BUYs: {buys}")
          PY
