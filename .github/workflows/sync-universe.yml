# Re-sync the tracked stock universe to the current NSE Nifty 500 list.
#
# Manual only (workflow_dispatch) — run it when NSE publishes an index review
# and the constituent list actually changes, typically twice a year plus
# ad-hoc replacements. There is no schedule: the index does not change on a
# cadence worth polling, and every run costs Angel One historical-API quota.
#
# BEFORE RUNNING: update ind_nifty500list.csv at the repo root and commit it.
# That file is the source of truth this workflow syncs *to*. It is downloaded
# manually from the NSE Nifty 500 index page rather than fetched here on
# purpose — NSE serves 403 to unattended datacentre clients, so a fetch step
# would fail in CI in a way that looks like "the index is unchanged".
#
# What it does (scripts/sync_nifty500_universe.py, 8 steps):
#   compare -> tokens -> constituents -> prices -> indicators -> news
#           -> retire -> report
#
# It STOPS BEFORE TRAINING. This workflow only prepares model inputs; the
# Friday weekly-retrain job trains them. That job enumerates
# `SELECT DISTINCT symbol FROM prices`, so anything backfilled here is picked
# up on the next run with no extra wiring.
#
# Models are pulled from the encrypted HF store first because the retire step
# decides what to archive by looking at final_models/ — on a bare runner that
# directory is empty and it would find nothing to retire. Retirement then
# deletes those models from the store too, so production stops trading names
# that left the index.
#
# The news step is the long pole: GDELT allows one request per 12s per
# (symbol, month), so a large intake can run for hours. news_from_year bounds it.
#
# Secrets required: PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD,
# ANGEL_API_KEY, ANGEL_CLIENT_ID, ANGEL_MPIN (or ANGEL_PASSWORD),
# ANGEL_TOTP_SECRET, HF_TOKEN (write), MODEL_KEY, HF_MODELS_REPO (optional).
name: Sync Nifty 500 universe

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Steps to run (comma-separated)'
        required: false
        default: 'compare,tokens,constituents,prices,indicators,news,retire,report'
      dry_run:
        description: 'Plan only — no DB writes, no Angel calls, no uploads'
        type: boolean
        required: false
        default: false
      rate_limit:
        description: 'Seconds between Angel historical calls (raise if rate-limited)'
        required: false
        default: '3.0'
      news_from_year:
        description: 'First year of GDELT news to backfill (blank = 2 years back)'
        required: false
        default: ''
      no_retire_remote:
        description: 'Keep de-indexed models on the HF store (retire locally only)'
        type: boolean
        required: false
        default: false

# Never overlap with the Friday retrain — both write final_models/ and the
# encrypted store, and an interleaved upload would mix two model sets.
concurrency:
  group: model-store-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: backend
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
      ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
      ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODEL_KEY: ${{ secrets.MODEL_KEY }}
      HF_MODELS_REPO: ${{ secrets.HF_MODELS_REPO }}
      HF_SPACE_REPO: MaheshMaheshwari/trademind
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Populates final_models/ and data/angel_tokens.json. Without this the
      # retire step sees nothing to archive — see the header note.
      - name: Sync model set from the encrypted store
        run: python scripts/model_store.py sync

      - name: Sync universe
        run: |
          python scripts/sync_nifty500_universe.py \
            --steps '${{ inputs.steps }}' \
            --rate-limit '${{ inputs.rate_limit }}' \
            ${{ inputs.news_from_year && format('--news-from-year {0}', inputs.news_from_year) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.no_retire_remote && '--no-retire-remote' || '' }}

      # Only the token map needs pushing — no models are trained here, and the
      # retire step already deleted the de-indexed ones from the store.
      # data/** is excluded from the Space deploy, so this is the only path
      # by which production sees the regenerated 500-symbol map.
      - name: Push token map to the store
        if: ${{ !inputs.dry_run }}
        run: python scripts/model_store.py upload "nifty 500 universe sync (run ${{ github.run_id }})" --data-only

      # Signals are deliberately NOT regenerated here — weekly-retrain.yml's
      # finalize job runs generate_trades.py after training, and that is the
      # single place signals are produced. Consequence to be aware of: rows for
      # the retired names stay in trade_signals until that Friday run, even
      # though their models are already gone from the store.
      - name: Restart the Space to pick up the new universe
        if: ${{ !inputs.dry_run }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ['HF_TOKEN']).restart_space(os.environ['HF_SPACE_REPO'])
          print('Space restart requested')
          "

      # The run log is the record of what changed: which symbols were
      # backfilled and how deep, which were gated out of training and on how
      # few bars, and which models were retired.
      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-universe-log-${{ github.run_id }}
          path: backend/logs/sync_universe_*.log
          if-no-files-found: warn
