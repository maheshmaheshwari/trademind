# Friday-night model retrain on GitHub-hosted runners.
#
# The HF Space (cpu-basic, 2 vCPU) cannot survive the full 502-model retrain —
# the container dies mid-run (see the failed weekly_retrain rows in
# scheduler_log for 2026-07-17), so scheduler/jobs.py no longer schedules the
# retrain when SPACE_ID is set and this workflow owns it instead.
#
# Four matrix shards each train ~125 models and push them models-only to the
# encrypted HF Hub store (scripts/model_store.py). The finalize job then pulls
# the complete fresh set, merges the shards' training stats, regenerates trade
# signals in the DB, pushes the data files, and restarts the Space so its
# startup sync picks up the new models.
#
# Secrets required: PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD,
# HF_TOKEN (write), MODEL_KEY, HF_MODELS_REPO (optional).
name: Weekly model retrain

on:
  schedule:
    - cron: '30 17 * * 5'   # Friday 23:00 IST — EOD prices land by ~16:30 IST
  workflow_dispatch:

concurrency:
  group: weekly-retrain
  cancel-in-progress: false

env:
  # All shards + finalize share one run_id so retrain_results.csv rows from
  # this logical run can be filtered together.
  RETRAIN_RUN_ID: gha_${{ github.run_id }}

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODEL_KEY: ${{ secrets.MODEL_KEY }}
      HF_MODELS_REPO: ${{ secrets.HF_MODELS_REPO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Retrain shard ${{ matrix.shard }}/4
        run: python scripts/weekly_retrain_pipeline.py --shard ${{ matrix.shard }}/4 --no-resume

      - name: Upload shard training stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-results-${{ matrix.shard }}
          path: backend/data/retrain_results.csv
          if-no-files-found: ignore

  finalize:
    needs: retrain
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODEL_KEY: ${{ secrets.MODEL_KEY }}
      HF_MODELS_REPO: ${{ secrets.HF_MODELS_REPO }}
      HF_SPACE_REPO: MaheshMaheshwari/trademind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Pulls the complete fresh model set the shards just pushed, plus the
      # store's existing data files (retrain_results.csv history, angel_tokens).
      - name: Sync full model set from the store
        run: python scripts/model_store.py sync

      - name: Download shard training stats
        uses: actions/download-artifact@v4
        with:
          pattern: retrain-results-*
          path: shard-results

      - name: Append shard stats to retrain_results.csv
        run: |
          for f in ../shard-results/*/retrain_results.csv; do
            [ -f "$f" ] || continue
            if [ ! -f data/retrain_results.csv ]; then
              head -1 "$f" > data/retrain_results.csv
            fi
            tail -n +2 "$f" >> data/retrain_results.csv
          done
          wc -l data/retrain_results.csv

      - name: Generate trade signals
        run: python scripts/generate_trades.py

      - name: Push training stats to the store
        run: python scripts/model_store.py upload "weekly retrain stats + signals" --data-only

      - name: Restart the Space to pick up fresh models
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ['HF_TOKEN']).restart_space(os.environ['HF_SPACE_REPO'])
          print('Space restart requested')
          "
