[pytest]
testpaths = tests
python_files = test_*.py
# tests/conftest.py imports database.db, which only resolves with backend/ on
# sys.path. `python -m pytest` prepends the cwd, but the bare `pytest` console
# script does not — without this, collection dies with
# "ModuleNotFoundError: No module named 'database'" before any test runs.
pythonpath = .
